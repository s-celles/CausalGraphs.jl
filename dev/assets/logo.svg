<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradients -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="100%" stop-color="#9013fe" />
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#d0021b" />
    </linearGradient>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
    <marker id="subArrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aaa" />
    </marker>
  </defs>

  <!-- Central Spine -->
  <path d="M 20 100 L 155 100" stroke="#666" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <!-- Main Bones (Categories) -->
  <!-- Top Bones -->
  <path d="M 50 30 L 90 100" stroke="#666" stroke-width="4" fill="none" />
  <path d="M 100 30 L 140 100" stroke="#666" stroke-width="4" fill="none" />
  <!-- Bottom Bones -->
  <path d="M 50 170 L 90 100" stroke="#666" stroke-width="4" fill="none" />
  <path d="M 100 170 L 140 100" stroke="#666" stroke-width="4" fill="none" />

  <!-- Sub-bones (Root Causes) -->
  <path d="M 25 50 L 68 62" stroke="#aaa" stroke-width="3" fill="none" marker-end="url(#subArrow)"/>
  <path d="M 75 50 L 118 62" stroke="#aaa" stroke-width="3" fill="none" marker-end="url(#subArrow)"/>
  
  <path d="M 25 150 L 68 138" stroke="#aaa" stroke-width="3" fill="none" marker-end="url(#subArrow)"/>
  <path d="M 75 150 L 118 138" stroke="#aaa" stroke-width="3" fill="none" marker-end="url(#subArrow)"/>

  <!-- Main Category Nodes -->
  <circle cx="50" cy="30" r="12" fill="url(#nodeGrad)" />
  <circle cx="100" cy="30" r="12" fill="url(#nodeGrad)" />
  <circle cx="50" cy="170" r="12" fill="url(#nodeGrad)" />
  <circle cx="100" cy="170" r="12" fill="url(#nodeGrad)" />

  <!-- Sub-cause Nodes -->
  <circle cx="25" cy="50" r="8" fill="url(#nodeGrad)" opacity="0.7"/>
  <circle cx="75" cy="50" r="8" fill="url(#nodeGrad)" opacity="0.7"/>
  <circle cx="25" cy="150" r="8" fill="url(#nodeGrad)" opacity="0.7"/>
  <circle cx="75" cy="150" r="8" fill="url(#nodeGrad)" opacity="0.7"/>

  <!-- Effect (Root) Node (The Fish Head) -->
  <!-- A slightly elongated shape to feel like a fish head, or just a large circle -->
  <ellipse cx="170" cy="100" rx="20" ry="25" fill="url(#rootGrad)" />
  <!-- Central detail in the head -->
  <circle cx="170" cy="100" r="10" fill="white" opacity="0.2" />
</svg>
