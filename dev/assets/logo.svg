<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Modern gradient for the nodes -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="100%" stop-color="#9013fe" />
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#d0021b" />
    </linearGradient>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="15" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
  </defs>

  <!-- Background (transparent or slightly rounded if desired, let's keep transparent) -->

  <!-- Edges -->
  <path d="M 50 50 L 140 100" stroke="#666" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 50 150 L 140 100" stroke="#666" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 30 100 L 140 100" stroke="#666" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- Secondary edges to represent depth -->
  <path d="M 20 20 L 50 50" stroke="#aaa" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 20 180 L 50 150" stroke="#aaa" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 80 20 L 50 50" stroke="#aaa" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Cause Nodes -->
  <circle cx="50" cy="50" r="15" fill="url(#nodeGrad)" />
  <circle cx="50" cy="150" r="15" fill="url(#nodeGrad)" />
  <circle cx="30" cy="100" r="12" fill="url(#nodeGrad)" />
  <circle cx="20" cy="20" r="10" fill="url(#nodeGrad)" opacity="0.7"/>
  <circle cx="80" cy="20" r="10" fill="url(#nodeGrad)" opacity="0.7"/>
  <circle cx="20" cy="180" r="10" fill="url(#nodeGrad)" opacity="0.7"/>

  <!-- Effect (Root) Node -->
  <circle cx="150" cy="100" r="25" fill="url(#rootGrad)" />
  
  <!-- Central icon in the root node (e.g. an exclamation or check mark or something graphy) -->
  <circle cx="150" cy="100" r="12" fill="white" opacity="0.2" />
</svg>
